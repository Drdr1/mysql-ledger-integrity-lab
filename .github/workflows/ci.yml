name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  integrity-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: ledger
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: ledger

    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpw --silent; then
              echo "mysql up"; break
            fi
            echo "waiting for mysql..."; sleep 2
          done

      - name: Print MySQL version (CHECK constraints need 8.0.16+)
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpw -e "SELECT VERSION();"

      - name: Install schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpw ledger < schema/00_install.sql

      - name: Re-run installer (must be idempotent / safe after partial install)
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpw ledger < schema/00_install.sql

      - name: Installer refuses to touch a pre-existing table it does not own
        run: |
          M="mysql -h 127.0.0.1 -P 3306 -uroot -prootpw"
          $M -e "CREATE DATABASE ledger_conflict;
                 CREATE TABLE ledger_conflict.payments (id INT PRIMARY KEY, note VARCHAR(32));
                 INSERT INTO ledger_conflict.payments VALUES (1, 'pre-existing, not ours');"
          if $M ledger_conflict < schema/00_install.sql; then
            echo "FAIL: installer ran over a foreign table"; exit 1
          fi
          # The foreign table is untouched (same 2 columns, same row) ...
          test "$($M -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='ledger_conflict' AND table_name='payments'")" = "2"
          test "$($M -N -e "SELECT note FROM ledger_conflict.payments WHERE id=1")" = "pre-existing, not ours"
          # ... and nothing else was created.
          test "$($M -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ledger_conflict'")" = "1"
          test "$($M -N -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='ledger_conflict'")" = "0"
          echo "OK: refused, foreign table intact, nothing created"

      - name: Interrupted install is completed by re-running the installer
        run: |
          M="mysql -h 127.0.0.1 -P 3306 -uroot -prootpw"
          $M -e "CREATE DATABASE ledger_partial"
          # Simulate an interruption after the tables step: no triggers, no chain head, no log.
          $M ledger_partial < schema/01_tables.sql
          $M ledger_partial < schema/00_install.sql
          test "$($M -N -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='ledger_partial'")" = "5"
          test "$($M -N -e "SELECT step FROM ledger_partial.ledger_migration_log WHERE step='verified'")" = "verified"
          $M ledger_partial < schema/inventory.sql
          echo "OK: partial install completed and verified"

      - name: Sample review corrections apply cleanly and close each finding
        run: |
          M="mysql -h 127.0.0.1 -P 3306 -uroot -prootpw"
          $M -e "CREATE DATABASE ledger_review"
          $M ledger_review < schema/00_install.sql
          $M ledger_review < sample-review/corrections.sql
          $M ledger_review < sample-review/corrections.sql   # re-runnable
          R="$M ledger_review"

          # Happy path still works, and status/total are maintained (F-02, F-04).
          $R -e "INSERT INTO payments (external_ref, amount_cents, status) VALUES ('pi_OK', 1000, 'captured');
                 INSERT INTO seller_earnings (payment_id, seller_id, amount_cents) VALUES (LAST_INSERT_ID(), 1, 1000);
                 SET @e = LAST_INSERT_ID();
                 INSERT INTO withdrawal_claims (seller_id, status) VALUES (1, 'pending');
                 SET @c = LAST_INSERT_ID();
                 INSERT INTO source_allocations (claim_id, earning_id, seller_id, amount_cents) VALUES (@c, @e, 1, 1000);"
          test "$($R -N -e "SELECT status FROM seller_earnings WHERE id = 1")" = "allocated"
          test "$($R -N -e "SELECT total_cents FROM withdrawal_claims WHERE id = 1")" = "1000"

          # F-03: an allocated earning's amount can no longer be changed.
          if $R -e "UPDATE seller_earnings SET amount_cents = 900 WHERE id = 1"; then echo "F-03 open"; exit 1; fi
          # F-03: allocations are immutable.
          if $R -e "UPDATE source_allocations SET amount_cents = 1 WHERE id = 1"; then echo "F-03 open"; exit 1; fi

          # F-01: earnings funded by a refunded payment cannot be allocated.
          $R -e "INSERT INTO payments (external_ref, amount_cents, status) VALUES ('pi_REFUNDED', 500, 'refunded');
                 INSERT INTO seller_earnings (payment_id, seller_id, amount_cents) VALUES (LAST_INSERT_ID(), 1, 500);"
          if $R -e "INSERT INTO source_allocations (claim_id, earning_id, seller_id, amount_cents) VALUES (1, 2, 1, 500)"; then echo "F-01 open"; exit 1; fi

          # F-02: a reversed earning cannot be allocated, even into an open claim.
          $R -e "INSERT INTO payments (external_ref, amount_cents, status) VALUES ('pi_REV', 300, 'captured');
                 INSERT INTO seller_earnings (payment_id, seller_id, amount_cents, status) VALUES (LAST_INSERT_ID(), 1, 300, 'reversed');"
          if $R -e "INSERT INTO source_allocations (claim_id, earning_id, seller_id, amount_cents) VALUES (1, 3, 1, 300)"; then echo "F-02 open"; exit 1; fi

          # F-05: allocations on an approved claim cannot be removed.
          $R -e "UPDATE withdrawal_claims SET status = 'approved' WHERE id = 1"
          if $R -e "DELETE FROM source_allocations WHERE claim_id = 1"; then echo "F-05 open"; exit 1; fi

          # F-06: case-distinct provider references are both accepted.
          $R -e "INSERT INTO payments (external_ref, amount_cents, status) VALUES ('pi_Case', 100, 'captured'), ('pi_case', 100, 'captured')"

          # The original installer assertion still passes on the corrected schema.
          $R < schema/00_install.sql
          echo "OK: corrections apply, re-run cleanly, and close F-01..F-06"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/requirements.txt

      - name: Run integrity + concurrency tests
        run: pytest -v tests/
