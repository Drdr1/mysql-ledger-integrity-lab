# Local run:
#   docker compose up -d
#   mysql -h 127.0.0.1 -uroot -prootpw ledger < schema/00_install.sql
#   DB_PASSWORD=rootpw pytest -v tests/
#   docker compose down -v
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: ledger
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20
